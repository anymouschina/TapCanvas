# Host-level ingress for the one-server production topology used by TapCanvas.
# The Docker web container owns SPA routing and /api + /public proxying; this
# layer only forwards public HTTP traffic to the web container on port 8080.
map $http_x_forwarded_proto $tapcanvas_forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$  http;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 64m;
    access_log /www/wwwlogs/tapcanvas-host.log;
    error_log /www/wwwlogs/tapcanvas-host.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tapcanvas_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream error timeout;
    }
}
