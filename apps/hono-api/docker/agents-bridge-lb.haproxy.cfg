global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 75s
    timeout client 1800s
    timeout server 1800s
    timeout http-request 30s
    timeout http-keep-alive 75s
    timeout tunnel 1800s

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold obsolete 30s

frontend agents_bridge_frontend
    bind :8799
    # Capture only the opaque routing digest so logs can prove session binding.
    capture request header x-tapcanvas-agent-session-affinity len 67
    default_backend agents_bridge_replicas

backend agents_bridge_replicas
    # Docker DNS returns one A record per live Compose replica. server-template
    # materializes those addresses as distinct hash peers; unlike one Nginx
    # hostname peer, the addresses cannot round-robin behind the hash decision.
    balance hdr(x-tapcanvas-agent-session-affinity)
    hash-type consistent

    # POST /chat can trigger paid side effects. A failed request must return to
    # Hono and resume from the durable checkpoint, never replay in this proxy.
    retries 0

    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host agents-bridge
    http-check expect status 200
    server-template bridge 16 agents-bridge:8799 check resolvers docker init-addr libc,none inter 5s fall 3 rise 2
