apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: loki-tapcanvas
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 5000
      # Correlate log lines that contain a requestId field back to full traces
      derivedFields:
        - name: RequestID
          matcherRegex: '"requestId"\s*:\s*"([^"]+)"'
          url: >-
            /explore?orgId=1&left={"datasource":"loki-tapcanvas","queries":[{"expr":"{service=~\".+\"} |= \"${__value.raw}\"","refId":"A"}]}
          urlDisplayLabel: Find all logs for this requestId
