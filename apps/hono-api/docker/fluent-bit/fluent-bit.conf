[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     warn
    # Parsers_File is auto-loaded from the default image path

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Tag               docker.*
    Parser            docker
    Refresh_Interval  10
    Skip_Empty_Lines  On
    Skip_Long_Lines   On
    DB                /state/flb.db
    DB.Sync           Normal
    Mem_Buf_Limit     5MB

[FILTER]
    Name          docker_metadata
    Match         docker.*
    Docker_URL    unix:///var/run/docker.sock
    Cache_TTL     60s

[OUTPUT]
    Name          loki
    Match         docker.*
    Host          victoria-logs
    Port          9428
    Uri           /insert/loki/api/v1/push
    Labels        job=docker
    Label_Keys    $container_name
    Line_Format   json
    Workers       1
