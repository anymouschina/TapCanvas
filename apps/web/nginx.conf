# TapCanvas 主前端 nginx：serve 预构建的 SPA 静态资源 + 同源反代后端。
# 对齐 apps/web/vite.config.ts 的 dev proxy：
#   /api/*    → api:8788  （去掉 /api 前缀，等价 vite rewrite）
#   /public/*       → api:8788  （保留前缀）
#   /assets/local/* → api:8788  （保留前缀，本地生成资产代理）
# 前端代码走相对路径（/api、/public），生产同源，无需 CORS、无需改 base url。
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 64m;          # 画布上传图片/音视频

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  # WebSocket 升级（Yjs 实时画布等；无 Upgrade 头时置 close）
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Preserve the original client scheme when this nginx sits behind a TLS
  # terminator. Otherwise HTTPS browser requests can reach the API as HTTP and
  # fail the API's same-origin protection.
  map $http_x_forwarded_proto $tapcanvas_forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$  http;
  }

  # Docker 内置 DNS。配合下方变量式 proxy_pass，让 api 容器名在「运行时」解析，
  # 而非 nginx 启动时解析一次就缓存。根治：api 容器重建换 IP 后，旧 upstream 缓存
  # 指向已消失的 IP → 全站 /api/* 502，必须手动 reload nginx。改为动态解析后，
  # api 换 IP 最多 valid TTL(10s) 后自愈，无需人工干预。
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    # Mutable version entrypoints must always come from the current container.
    # Hashed assets keep their immutable policy below.
    location = /index.html {
      add_header Cache-Control "no-store, max-age=0";
    }

    location = /sw.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # /api/* → api:8788/*（去掉 /api 前缀）。proxy_buffering off 支持 SSE 实时流。
    # 变量式 proxy_pass 不做自动前缀剥离，故用 rewrite 去掉 /api 前缀（等价原尾斜杠语义）。
    location /api/ {
      # set 必须在 rewrite...break 之前：break 会停止后续 rewrite 模块指令(含 set)，
      # 否则 $api_backend 为空 → proxy_pass "" → "invalid URL prefix in ''" 全站 500。
      set $api_backend http://api:8788;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $tapcanvas_forwarded_proto;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Prefix /api;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }

    # /public/* → api:8788/public/*（保留前缀；变量式 proxy_pass 默认透传完整 $uri）
    location /public/ {
      set $api_backend http://api:8788;
      proxy_pass $api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $tapcanvas_forwarded_proto;
      proxy_set_header X-Forwarded-Host   $host;
      proxy_set_header X-Forwarded-Prefix "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # 本地生成资产由 API 做路径边界校验、Range 响应与内容类型处理。
    # 必须位于静态 /assets/ 规则之前，不能回退到 SPA index.html。
    location /assets/local/ {
      set $api_backend http://api:8788;
      proxy_pass $api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $tapcanvas_forwarded_proto;
      proxy_set_header X-Forwarded-Host   $host;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # 带 hash 的静态资源永久缓存
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # SPA 路由兜底
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
